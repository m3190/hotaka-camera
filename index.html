<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
    
<title>ライブカメラ一覧</title>

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        min-height: 100%;
    }

    body {
        overflow-y: auto;
    }

    /* PC・タブレット：3列×3段 */
    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 10px;
        box-sizing: border-box;
        background: #111;
    }

    .panel {
        position: relative;
        overflow: hidden;
        background: #000;

        /* 画面内に上下2段が収まる高さ */
        height: calc((100vh - 30px) / 2);

        border: 2px solid #444;
        border-radius: 8px;
        box-sizing: border-box;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
    }

    .panel img,
    .panel iframe {
        width: 100%;
        height: 100%;
        border: 0;
        object-fit: contain;
        background: #000;
    }

    .label {
        position: absolute;
        left: 8px;
        top: 8px;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font-size: 14px;
        font-weight: bold;
        padding: 4px 8px;
        border-radius: 4px;
        font-family: sans-serif;
    }

    /* スマホ：縦1列 */
    @media (max-width: 768px) {
        .grid {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 10px;
            padding: 10px;
        }

        .panel {
            width: 100%;
            height: 45vh;
            min-height: 280px;
        }
    }
</style>
</head>

<body>

<div class="grid">

    <div class="panel">
        <div class="label">穂高岳山荘 東</div>
        <img id="hotaka1"
            src="https://www.hotakadakesanso.com/livecam-data/hotakacam1.jpg">
    </div>

    <div class="panel">
        <div class="label">穂高岳山荘 西</div>
        <img id="hotaka2"
            src="https://www.hotakadakesanso.com/livecam-data/hotakacam2.jpg">
    </div>

    <div class="panel">
        <div class="label">涸沢ヒュッテ</div>
        <img id="karasawa"
            src="https://www.kamikochi-vc.or.jp/livecam/northalps_latest_images/karasawa.jpg">
    </div>

    <div class="panel">
        <div class="label">蝶ヶ岳ヒュッテ</div>
        <img id="cho"
            src="https://www.kamikochi-vc.or.jp/livecam/northalps_latest_images/cyougatake.jpg">
    </div>

    <div class="panel">
        <div class="label">五千尺</div>
        <iframe
    src="https://www.youtube.com/embed/Iv2VUE_UhRQ?autoplay=1&mute=1&playsinline=1"
    allow="autoplay; fullscreen"
    allowfullscreen>
</iframe>
    </div>

    <div class="panel">
        <div class="label">上高地バスターミナル</div>
       <iframe
    src="https://www.youtube.com/embed/Hz3GKL4yDcw?autoplay=1&mute=1&playsinline=1"
    allow="autoplay; fullscreen"
    allowfullscreen>
</iframe>
    </div>

    
    <div class="panel">
    <div class="label">北穂</div>
    <img id="Kitaho"
        src="https://www.kamikochi-vc.or.jp/livecam/northalps_latest_images/kitaho.jpg">
</div>

<div class="panel">
    <div class="label">新穂高ロープウェイ ライブカメラ</div>
    <iframe 
        src="https://www.youtube.com/embed/PbiRK9sVw9s?autoplay=1&mute=1&playsinline=1"
        allow="autoplay; fullscreen">
    </iframe>
</div>

<div class="panel">
    <div class="label">槍ヶ岳山荘</div>
    <img id="yarigatake"
         referrerpolicy="no-referrer"
         src="https://www.yarigatake.co.jp/webcamera/yarigatake/yari-cam.jpg">
</div>

</div>

<script>
    function refreshImages() {
        const t = Date.now();

        document.getElementById('hotaka1').src =
            'https://www.hotakadakesanso.com/livecam-data/hotakacam1.jpg?t=' + t;

        document.getElementById('hotaka2').src =
            'https://www.hotakadakesanso.com/livecam-data/hotakacam2.jpg?t=' + t;

        document.getElementById('karasawa').src =
            'https://www.kamikochi-vc.or.jp/livecam/northalps_latest_images/karasawa.jpg?t=' + t;

        document.getElementById('cho').src =
            'https://www.kamikochi-vc.or.jp/livecam/northalps_latest_images/cyougatake.jpg?t=' + t;
        
        const yari = document.getElementById('yarigatake');

yari.removeAttribute('src');

setTimeout(function () {
    yari.src =
        'https://www.yarigatake.co.jp/webcamera/yarigatake/yari-cam.jpg?nocache='
        + Date.now();
}, 100);
        document.getElementById('Kitaho').src =
    'https://www.kamikochi-vc.or.jp/livecam/northalps_latest_images/kitaho.jpg?t=' + t;
    }
refreshImages();
setInterval(refreshImages, 300000);
</script>
</body>
</html>
