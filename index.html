<title>ライブカメラ一覧</title>

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #000;
    }

    body {
        overflow-y: auto;
    }

    /* ========================================
       PC・タブレット
       3列表示
       最初の画面には2段（6枚）が収まる
       ======================================== */

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 10px;
        box-sizing: border-box;
        background: #111;
    }

    .panel {
        position: relative;
        overflow: hidden;
        background: #000;

        /* 画面内に2段が収まる高さ */
        height: calc((100vh - 30px) / 2);

        border: 2px solid #444;
        border-radius: 8px;
        box-sizing: border-box;

        box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
    }

    .panel img,
    .panel iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;

        object-fit: contain;
        background: #000;
    }

    .label {
        position: absolute;
        left: 8px;
        top: 8px;

        z-index: 1000;

        background: rgba(0, 0, 0, 0.65);
        color: white;

        font-family: sans-serif;
        font-size: 14px;
        font-weight: bold;

        padding: 4px 8px;
        border-radius: 4px;

        pointer-events: none;
    }


    /* ========================================
       スマホ
       縦1列
       ======================================== */

    @media (max-width: 768px) {

        .grid {
            display: flex;
            flex-direction: column;

            width: 100%;

            gap: 10px;
            padding: 10px;

            box-sizing: border-box;
        }

        .panel {
            width: 100%;

            height: 45vh;
            min-height: 280px;
        }

        .panel img {
            object-fit: contain;
        }
    }
</style>

<script>

    /* ========================================
       静止画像を5分おきに再取得
       ======================================== */

    function refreshImages() {

        const t = Date.now();


        document.getElementById('hotaka1').src =
            'https://www.hotakadakesanso.com/livecam-data/hotakacam1.jpg?t=' + t;


        document.getElementById('hotaka2').src =
            'https://www.hotakadakesanso.com/livecam-data/hotakacam2.jpg?t=' + t;


        document.getElementById('karasawa').src =
            'https://www.kamikochi-vc.or.jp/livecam/northalps_latest_images/karasawa.jpg?t=' + t;


        document.getElementById('cho').src =
            'https://www.kamikochi-vc.or.jp/livecam/northalps_latest_images/cyougatake.jpg?t=' + t;


        document.getElementById('Kitaho').src =
            'https://www.kamikochi-vc.or.jp/livecam/northalps_latest_images/kitaho.jpg?t=' + t;



        /*
           槍ヶ岳山荘

           キャッシュが残りやすいため、
           一度srcを外してから再取得する
        */

        const yari =
            document.getElementById('yarigatake');


        yari.removeAttribute('src');


        setTimeout(function () {

            yari.src =
                'https://www.yarigatake.co.jp/webcamera/yarigatake/yari-cam.jpg?nocache='
                + Date.now();

        }, 100);

    }



    /* 5分 = 300,000ミリ秒 */

    setInterval(
        refreshImages,
        300000
    );



    /* ========================================
       YouTubeを時間差で読み込み
       
       一度に4本接続しないことで
       ページ表示時の負荷を分散
       ======================================== */

    function startYouTube() {


        /* 0秒
           五千尺 */

        const youtube1 =
            document.getElementById('youtube1');

        youtube1.src =
            youtube1.dataset.src;



        /* 0.8秒後
           上高地バスターミナル */

        setTimeout(function () {

            const youtube2 =
                document.getElementById('youtube2');

            youtube2.src =
                youtube2.dataset.src;

        }, 800);



        /* 1.6秒後
           新穂高ロープウェイ */

        setTimeout(function () {

            const youtube3 =
                document.getElementById('youtube3');

            youtube3.src =
                youtube3.dataset.src;

        }, 1600);




    }



    /* YouTube読み込み開始 */

    startYouTube();


</script>
